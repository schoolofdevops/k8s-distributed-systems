name: Deploy to GitHub Pages

# This repo holds the pre-built static site, pushed here by the private src
# repo's own build workflow. This workflow's only job is to publish whatever
# lands on this branch via the native GitHub Pages (Actions) deployment.
#
# NOTE: the src repo's deploy step now uses keep_files: true so this file
# survives future deploys — without it, every push here replaces the whole
# branch with just the built site and silently deletes this workflow.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
